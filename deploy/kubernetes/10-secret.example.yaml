# Example only — DO NOT commit real secrets.
# Create the real Secret with:
#   kubectl -n ai-risk-platform create secret generic ai-risk-platform-secrets \
#     --from-literal=api-key=$(openssl rand -hex 32)
#
# For Bedrock auth, prefer IRSA (EKS) / Workload Identity (GKE) over
# embedding AWS creds. See docs/DEPLOY.md.
apiVersion: v1
kind: Secret
metadata:
  name: ai-risk-platform-secrets
  namespace: ai-risk-platform
type: Opaque
stringData:
  api-key: "REPLACE-WITH-OPENSSL-RAND-HEX-32"
