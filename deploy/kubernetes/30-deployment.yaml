apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-risk-platform
  namespace: ai-risk-platform
  labels:
    app.kubernetes.io/name: ai-risk-platform
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-risk-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-risk-platform
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: ai-risk-platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: server
          # Replace with your registry path. Build with: docker build -t <ref> .
          image: ghcr.io/s1ns3nz0/ai-risk-platform:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--job-backend"
            - "redis"
            - "--redis-url"
            - "redis://redis.ai-risk-platform.svc.cluster.local:6379/0"
            - "--products-dir"
            - "/etc/orchestrator/products"
            - "--worker-concurrency"
            - "4"
          env:
            - name: ORCHESTRATOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-risk-platform-secrets
                  key: api-key
            # Optional — enables AI (Bedrock) mode.
            # - name: BEDROCK_MODEL_ID
            #   value: "jp.anthropic.claude-sonnet-4-6"
            # - name: AWS_DEFAULT_REGION
            #   value: "ap-northeast-1"
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # Bedrock mode holds boto3 sessions per request; bump if you see
              # OOMs under load. Static mode rarely needs >256Mi.
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: products
              mountPath: /etc/orchestrator/products/payment-api
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: products
          configMap:
            name: ai-risk-platform-product-payment-api
        - name: tmp
          emptyDir: {}
