# Product configs live in this ConfigMap. Each top-level key is a file path
# the server reads from /etc/orchestrator/products/{product}/{file}.
#
# After editing, apply and call /v1/admin/reload to pick up changes without
# a pod restart:
#   kubectl -n ai-risk-platform apply -f 11-configmap-products.yaml
#   curl -X POST -H "X-API-Key: $KEY" https://your-host/v1/admin/reload
#
# For multiple products, add more entries — each product needs its own
# subdirectory. We use one ConfigMap per product to keep size manageable
# (ConfigMaps cap at 1 MiB).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-risk-platform-product-payment-api
  namespace: ai-risk-platform
data:
  product-manifest.yaml: |
    product:
      name: payment-api
      description: "QR code payment confirmation service"
      data_classification:
        - PCI
        - PII-financial
      jurisdiction:
        - JP
      deployment:
        cloud: AWS
        region: ap-northeast-1
        compute:
          - type: EKS
            description: "Main application containers"
      impact_levels:
        confidentiality: high
        integrity: high
        availability: moderate
      integrations:
        - external-payment-gateway
        - internal-user-db
  risk-profile.yaml: |
    risk_profile:
      frameworks:
        - pci-dss-4.0
        - asvs-4.0.3-L3
      risk_appetite: conservative
      thresholds:
        critical:
          max_critical_findings: 0
          max_secrets_detected: 0
          action: block
        high:
          max_critical_findings: 0
          action: block
        medium:
          max_high_findings: 5
          action: proceed
        low:
          action: proceed
      failure_policy:
        critical:
          scan_failure: block
        high:
          scan_failure: block
        medium:
          scan_failure: proceed
        low:
          scan_failure: proceed
