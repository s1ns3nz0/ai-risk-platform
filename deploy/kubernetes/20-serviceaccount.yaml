# For Bedrock (AI mode) on EKS, attach the IAM role that grants
# `bedrock:InvokeModel` via the IRSA annotation:
#   eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/ai-risk-platform-bedrock
#
# On GKE use Workload Identity:
#   iam.gke.io/gcp-service-account: ai-risk-platform@<project>.iam.gserviceaccount.com
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-risk-platform
  namespace: ai-risk-platform
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ai-risk-platform-bedrock
