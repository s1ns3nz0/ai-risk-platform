# Scales replicas on CPU. Bedrock mode is rarely CPU-bound — for AI workloads
# scale on queue depth instead (custom metric via KEDA pointing at
# orchestrator:queue:assess length).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-risk-platform
  namespace: ai-risk-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-risk-platform
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
